# CI: build the compiler and run the "ci" acceptance tier (./check.sh ci).
#
# What this job judges: **does it build, and are the results correct**.  Nothing here
# judges speed.  No benchmark runs, no callgrind item runs, and no BLAS/ggml acceleration
# ratio is checked -- those numbers move with the compiler, the valgrind version and the
# machine, so they belong on a machine kept for that purpose (local ./check.sh nobench
# or the full tier), not on a shared runner.  See the CI tuple in tools/check.py: the "ci"
# tier is an explicit allowlist of correctness items, and tools/check.py refuses to run
# a benchmark/callgrind/perf item in it.
#
# The matrix covers the two supported C-library baselines, nothing else:
#   ubuntu-22.04 = oldest supported (glibc 2.35, gcc 11, Python 3.10)
#   ubuntu-24.04 = current (glibc 2.39, gcc 13, Python 3.12)
# Different cc versions are the point: the promise is "C the type checker passed is C
# every supported cc compiles", and gcc 11 vs 13 is where that can break.  A Debian
# bookworm container was dropped: it lacks /usr/bin/time, a TTY and the sanitizer runtime,
# so a large part of the tree fails for environmental reasons, while its glibc 2.36 sits
# between the two baselines and adds little.
#
# The job needs a C compiler, python3 and valgrind.  valgrind is not part of the
# cc+python3 contract -- items that need it print a skip line -- so this job installs
# it for the map / pool functional suites and then turns a skip into a failure:
# "installed but not effective" is a broken state.  Python 3.10 has no tomllib; the
# extpkg suite needs it, so tomli is installed there.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless; results are per-commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    # fail-fast: false is deliberate: an old-distro failure must not hide that the modern
    # baseline is green, and annotations are per-job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build the compiler
        run: make -j"$(nproc)"

      - name: compiler warnings must stay at zero
        run: |
          make clean
          make -j"$(nproc)" 2>&1 | tee /tmp/build.log
          ! grep -q "warning:" /tmp/build.log

      - name: test tooling (valgrind for map/pool; tomli for extpkg on Python 3.10)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version
          if ! python3 -c "import tomllib" 2>/dev/null; then
            sudo apt-get install -y -qq python3-tomli || python3 -m pip install --user tomli
          fi
          python3 -c "import tomllib" 2>/dev/null || python3 -c "import tomli" \
            || { echo "::error::Python 3.10 needs tomli for the extpkg suite"; exit 1; }

      - name: "extc --version（版本来自仓库根的 VERSION，一处定义）"
        run: ./build/extc --version

      - name: "make install 到一个临时前缀，并用装好的编译器编译一个小程序"
        # 装完能跑才算装对：标准库的位置由二进制自己的路径推出，装错目录就等于装了个
        # 编不了 use std::io 的编译器 —— 这一步专门钉这个不变量。
        run: |
          make install PREFIX="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/extc" --version
          mkdir -p "$RUNNER_TEMP/proj"
          printf 'use std::io\n\nfn main() {\n    io::println("installed ok")\n}\n' > "$RUNNER_TEMP/proj/main.extc"
          ( cd "$RUNNER_TEMP/proj" && "$RUNNER_TEMP/prefix/bin/extc" run main.extc )

      - name: 这台机器上有什么（注解是唯一读得到的通道 ⇒ 关键工具先报上来）
        run: |
          echo "::notice::runner: nproc=$(nproc) · cc=$(cc --version | head -1) · glibc=$(ldd --version | head -1) · python3=$(python3 -V 2>&1) · /usr/bin/time=$(test -x /usr/bin/time && echo 有 || echo 无) · valgrind=$(valgrind --version 2>/dev/null || echo 无)"

      - name: ci acceptance suite (./check.sh ci)
        # 失败要**能从 API 读到**：跑 CI 的机器上没有 gh，看不了 Actions 日志；
        # 而 ::error:: 会变成 GitHub 注解，注解对公开仓库**无需认证**即可读
        # （/commits/<sha>/check-runs → annotations_url）。注解一步最多 10 条，所以失败项清单
        # 只从耗时表读（tools/ci_annotate.py）—— 别 grep -a FAIL：闸门会为已知欠账打 FAIL，
        # 那样抓到的多半是噪声，真正的失败项被挤出 10 条之外。
        # 每个失败项的现场由 tools/check.py 的 dump_fail 摘出来（判据自己的 FAIL 行 + 尾部若干行，
        # 因为闸门常把真正的失败打在前、后面接一堆逐形状的 ok）。
        run: |
          set +e
          ./check.sh ci > /tmp/ci.log 2>&1
          rc=$?
          tail -30 /tmp/ci.log
          if [ "$rc" -ne 0 ]; then
            python3 tools/ci_annotate.py --log /tmp/ci.log --times "${SEC_TIMES:-/tmp/extc-check-times.tsv}"
          fi
          # 装了 valgrind 却仍跳过 ⇒ 依赖它的功能项（map/pool 等）在 CI 上没跑（上面那步白装了）——
          # 这是失败，不是"跳过"。本机缺 valgrind 时才允许跳过（契约：只要 cc + python3）。
          if grep -aq "跳过：没有 valgrind" /tmp/ci.log; then
            echo "::error::依赖 valgrind 的功能项被跳过：valgrind 没生效（判据没跑）"
            rc=1
          fi
          exit "$rc"
